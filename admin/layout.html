<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>{{title}} | PDC Admin</title><meta name="theme-color" content="#040b2e"><link rel="icon" href="/assets/logo.webp"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/admin/admin.css"><script src="/assets/admin/core.js"></script></head>
<body{{owner}}>
<div class="orb o1"></div><div class="orb o2"></div>
<div class="adm-shell">
 <aside class="adm-side" id="side">
  <div class="side-head">
   <a class="side-brand" href="/admin/overview"><span class="chip"><img src="/assets/logo.webp" alt=""></span><span class="side-t"><b>PDC</b><small>Admin console</small></span></a>
   <button class="side-collapse" id="collapse" type="button" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
  </div>
  <div class="side-nav">{{nav}}</div>
  <div class="side-foot">
   <div class="acct-menu" id="acctmenu" hidden>
    <a href="/" target="_blank" rel="noopener">View site</a>
    <button id="signout" type="button">Sign out</button>
   </div>
   <button class="acct" id="acct" type="button" aria-expanded="false" aria-controls="acctmenu">
    <span class="avatar" id="avatar">?</span>
    <span class="acct-t"><small>Signed in</small><b id="who">&nbsp;</b></span>
    <svg class="acct-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
   </button>
  </div>
 </aside>
 <div class="side-scrim" id="scrim"></div>
 <div class="adm-main">
  <header class="adm-top">
   <button class="side-toggle" id="sidebtn" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button>
   <span class="pill"><i></i>Restricted area</span>
   <h1>{{title}}</h1>
   <p class="sub">{{desc}}</p>
  </header>
  <main id="main">{{content}}</main>
 </div>
</div>
</body></html>
